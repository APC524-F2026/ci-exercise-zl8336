[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unc"
version = "0.1.0"
description = "Simple uncertainty calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    'typing_extensions; python_version < "3.13"',
]

[dependency-groups]
test = [
    "pytest",
    "uncertainties",
]
docs = [
    "sphinx",
    "furo",
    "myst_parser",
    "sphinx-markdown-builder",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unc"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "I", "RUF", "UP"]
